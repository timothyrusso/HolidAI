# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Pull Request

on:
  push:
    branches: ["main", "test", "development"]
  pull_request:
    branches: ["main", "test", "development"]

jobs:
  # Kept separate from `build` on purpose: a Storybook bundling failure must not bury a
  # lint/tsc failure in the same log. The existing checks already type-check and lint the story
  # files; what they cannot see is whether the Vite + react-native-web pipeline can bundle them.
  storybook-changes:
    runs-on: ubuntu-latest
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            storybook:
              - '**/*.stories.tsx'
              - '.storybook/**'
              - '.rnstorybook/**'
              # The stories import the design system, so a change in there can break the
              # bundle even when no story file is touched. Deliberately not `features/**`:
              # that would run this job on nearly every pull request.
              - 'features/core/design-system/**'
              - 'package.json'
              - 'package-lock.json'

  storybook:
    needs: storybook-changes
    if: needs.storybook-changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # `npm ci` only — no `npm install --package-lock-only` first: regenerating the lockfile
      # would let a manifest/lockfile mismatch pass here that a clean install rejects.
      - run: npm ci
      - run: npm run storybook:build

  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run lint
      - run: npm run test:eslint-rules
      - run: npm run lint:compiler
      - run: npx tsc --noEmit

      - name: Architecture check
        if: github.event_name == 'pull_request'
        id: arch
        run: |
          set +e
          OUTPUT=$(npm run arch 2>&1)
          EXIT_CODE=$?
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Architecture check (non-PR)
        if: github.event_name != 'pull_request'
        run: npm run arch

      - name: Update architecture violations comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- arch-violations -->';
            const hasFailed = '${{ steps.arch.outputs.exit_code }}' !== '0';
            const output = `${{ steps.arch.outputs.output }}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (!hasFailed) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const body = [
              marker,
              '## Architecture violations found',
              '',
              'The following dependency-cruiser rules were violated. Fix them before merging.',
              '',
              '```',
              output,
              '```',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
